<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Once Demo</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5efe5;
        --card: #fffaf2;
        --text: #1d1b16;
        --accent: #1d6b57;
        --muted: #6e6559;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Georgia", "Times New Roman", serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, #f7d8ad 0, transparent 28%),
          radial-gradient(circle at bottom right, #c9ead9 0, transparent 30%),
          var(--bg);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(720px, calc(100vw - 32px));
        padding: 40px;
        border: 1px solid rgba(29, 27, 22, 0.12);
        border-radius: 24px;
        background: var(--card);
        box-shadow: 0 20px 60px rgba(29, 27, 22, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.6rem, 8vw, 4.5rem);
        line-height: 0.95;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.1rem;
        line-height: 1.6;
      }

      .pill {
        display: inline-block;
        margin-bottom: 18px;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--accent);
        color: white;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="pill">Once Demo</div>
      <h1>Static app, real proxy, real accessories.</h1>
      <p>
        This page is served from a tiny custom image built locally for the Once
        accessory demo. The public route goes through Cloudflare Tunnel and the
        local stack includes multiple shared accessories around it.
      </p>
    </main>
  </body>
</html>
